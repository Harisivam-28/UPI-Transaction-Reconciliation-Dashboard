# Integration test profile — uses Testcontainers for Postgres, Kafka, Redis.
# DataSource, Kafka, and Redis URLs are injected by @DynamicPropertySource.
server:
  port: 0

spring:
  application:
    name: upi-reconcile-integration-test

  jpa:
    hibernate:
      ddl-auto: none   # Flyway handles schema
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    consumer:
      group-id: upi-reconcile-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: MANUAL_IMMEDIATE

management:
  metrics:
    export:
      prometheus:
        enabled: false

# Time compression — fast for tests
reconciliation:
  simulated-day-seconds: 20
  batch-tick-interval-seconds: 7
  escalation-threshold-days: 2

ml-service:
  base-url: http://localhost:9999   # not used in this test

# ── Connectors Module ─────────────────────────────────────────
app:
  encryption:
    aes-key: JroH8+vWHFtReNnvTAPNMbTO/KLvJ678oafYsBh4H5A=
  connectors:
    default-remitter-bank-id: 00000000-0000-0000-0000-000000000001
    default-beneficiary-bank-id: 00000000-0000-0000-0000-000000000002

