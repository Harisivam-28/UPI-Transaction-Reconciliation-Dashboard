server:
  port: 8080

spring:
  application:
    name: upi-reconcile

  # ── PostgreSQL ──────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/upi_reconcile
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Flyway ─────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ── Redis ──────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379

  # ── Kafka ──────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: upi-reconcile-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: MANUAL_IMMEDIATE

# ── Actuator / Prometheus ──────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# ── ML Service ─────────────────────────────────────────────
ml-service:
  base-url: http://localhost:8000

# ── Time Compression (ARCHITECTURE.md §3) ─────────────────
reconciliation:
  simulated-day-seconds: 20
  batch-tick-interval-seconds: 7    # ~20/3, mimics 11PM/2AM/5AM batch cadence
  escalation-threshold-days: 2      # demo: T+3
  anomaly-window-seconds: 60        # §5: rolling window for failure-rate computation
